name: Build Cross-Platform

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.12.0'

jobs:
  lint-workflows:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Download actionlint
      shell: bash
      run: |
        set -euo pipefail
        ACTIONLINT_VERSION='1.7.12'
        ACTIONLINT_ARCHIVE="/tmp/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl -fsSL \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
          -o "$ACTIONLINT_ARCHIVE"
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $ACTIONLINT_ARCHIVE" |
          sha256sum --check
        tar -xzf "$ACTIONLINT_ARCHIVE" -C /tmp actionlint

    - name: Check workflow files
      shell: bash
      run: /tmp/actionlint -color

  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Verify source
      run: npm run verify

    - name: Smoke-test Linux unpacked package
      run: npx electron-builder --linux --dir --publish=never

  audit-build-chain:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Audit build dependencies
      run: npm audit --audit-level=high

  build:
    needs:
      - lint-workflows
      - verify
      - audit-build-chain
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_script: build-mac
            artifacts: dist/*.dmg
          - os: windows-latest
            build_script: build-win
            artifacts: dist/*.exe
          - os: ubuntu-latest
            build_script: build-linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libarchive-tools

    - name: Build application
      run: npm run ${{ matrix.build_script }}

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ matrix.os }}-build
        path: ${{ matrix.artifacts }}
        if-no-files-found: error
        retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Get version from package.json
      id: package_version
      run: |
        VERSION="$(node -p "require('./package.json').version")"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Verify tag matches package version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PACKAGE_VERSION: ${{ steps.package_version.outputs.version }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        TAG="v${PACKAGE_VERSION}"

        if [ "$TAG" != "$TAG_NAME" ]; then
          echo "::error::Tag $TAG_NAME does not match package.json version $PACKAGE_VERSION."
          exit 1
        fi

        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "::error::Release $TAG already exists. Bump package.json before publishing a new release."
          exit 1
        fi

    - name: Download all artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        path: ./artifacts

    - name: Prepare release assets
      shell: bash
      run: |
        set -euo pipefail
        shopt -s globstar nullglob

        exe=(./artifacts/**/*.exe)
        dmg=(./artifacts/**/*.dmg)
        appimage=(./artifacts/**/*.AppImage)
        deb=(./artifacts/**/*.deb)
        x64_dmg=()
        arm64_dmg=()

        require_count() {
          local expected="$1"
          local label="$2"
          shift 2
          if [ "$#" -ne "$expected" ]; then
            echo "::error::Expected $expected $label, found $#."
            exit 1
          fi
        }

        require_count 1 'Windows .exe' "${exe[@]}"
        require_count 2 'macOS .dmg files' "${dmg[@]}"
        require_count 1 'Linux .AppImage' "${appimage[@]}"
        require_count 1 'Linux .deb' "${deb[@]}"

        for file in "${dmg[@]}"; do
          case "$(basename "$file")" in
            *-arm64.dmg) arm64_dmg+=("$file") ;;
            *.dmg) x64_dmg+=("$file") ;;
          esac
        done
        require_count 1 'macOS x64 .dmg' "${x64_dmg[@]}"
        require_count 1 'macOS arm64 .dmg' "${arm64_dmg[@]}"

        mkdir -p ./release-assets
        cp -- "${exe[@]}" "${dmg[@]}" "${appimage[@]}" "${deb[@]}" ./release-assets/

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        tag_name: v${{ steps.package_version.outputs.version }}
        name: Echosight v${{ steps.package_version.outputs.version }}
        body: |
          ## Echosight PoE2 Task Overlay v${{ steps.package_version.outputs.version }}

          **Download for your platform:**
          - **Windows**: `.exe` file
          - **macOS**: `.dmg` file
          - **Linux**: `.AppImage` or `.deb` file

          ### Changes in this release
          - Auto-generated release from commit: ${{ github.sha }}
          - Built from branch: ${{ github.ref_name }}

          ### Installation
          - **Windows**: Download the `.exe` file and run it directly (portable)
          - **macOS**: Download and mount the `.dmg` file, then drag to Applications
          - **Linux**: Download `.AppImage` (make executable and run) or install `.deb` package

          ---
          *This is an automated release created by GitHub Actions*
        files: ./release-assets/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
